# Local development.
#
# Brings up what the API needs and nothing it does not: Postgres, Redis, and
# Keycloak for the console's sign-in. The API itself runs from your IDE or from
# `mvn spring-boot:run`, because you will be restarting it constantly.
#
#   docker compose up -d
#
# See SETUP.md for what to do next.

name: csp

services:
  db:
    image: postgres:16-alpine
    environment:
      # `postgres` bootstraps; the application connects as `csp`, which the init
      # script below creates as an ordinary role. POSTGRES_USER here would make
      # `csp` the superuser, and a superuser bypasses row-level security
      # entirely — every policy in this schema would stop applying, silently.
      # See deploy/local/init-db.sql.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      # Deterministic collation: an ORDER BY that differs between a laptop and
      # Abuja is a very slow bug to find.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    command:
      - postgres
      # pgAudit in production, per the build spec. Locally this is enough to
      # see what the application actually runs.
      - -c
      - log_statement=none
      - -c
      - max_connections=100
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./deploy/local/init-db.sql:/docker-entrypoint-initdb.d/10-init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    # OTP challenges and rate limits. Nothing here needs to survive a restart,
    # so persistence is off — which also makes "it works after a restart" honest.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8080"
    volumes:
      # The realm, its eight roles, and four console users with known passwords.
      - ./deploy/local/keycloak-realm.json:/opt/keycloak/data/import/csp-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\nhost: localhost\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Claim evidence, when you want the real thing rather than a directory.
  #
  # `csp.evidence.mode=local` needs none of this and is the default, so this
  # service is in the `s3` profile and stays down unless you ask for it:
  #
  #   docker compose --profile s3 up -d
  #   EVIDENCE_MODE=s3 EVIDENCE_ENDPOINT=http://localhost:9000 \
  #     EVIDENCE_BUCKET=csp-evidence EVIDENCE_ACCESS_KEY=csp \
  #     EVIDENCE_SECRET_KEY=csp-secret mvn spring-boot:run
  #
  # Worth doing before anything ships: presigned URLs, CORS on the bucket and
  # server-side encryption are all things that work on a directory and then do
  # not work on a bucket.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["s3"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: csp
      MINIO_ROOT_PASSWORD: csp-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Creates the bucket and lets the browser PUT to it, then exits.
  #
  # The CORS rule is the part people forget. A presigned URL the browser is not
  # allowed to call fails as an opaque network error with nothing in any log,
  # and the upload looks like it is the application's fault.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    profiles: ["s3"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 csp csp-secret
        mc mb --ignore-existing local/csp-evidence
        mc anonymous set none local/csp-evidence
        cat >/tmp/cors.json <<'JSON'
        {"CORSRules":[{"AllowedOrigins":["*"],"AllowedMethods":["PUT","GET","HEAD"],
          "AllowedHeaders":["*"],"ExposeHeaders":["ETag"],"MaxAgeSeconds":3000}]}
        JSON
        mc cors set local/csp-evidence /tmp/cors.json
        echo "bucket csp-evidence ready"

volumes:
  db-data:
  minio-data:
