apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
/*
 * On in release, because the spec's budget is an 8 MB APK.
 *
 * R8 with the React Native rules already in `proguard-rules.pro`. It is off in
 * debug so a stack trace still names the class it came from.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

/*
 * The upload key: never in this repository, and never the debug key.
 *
 * Read from Gradle properties first and the environment second, so the same
 * four names work from `~/.gradle/gradle.properties` on a build machine, from
 * `-P` on the command line, and from secrets in CI.
 */
def credential = { String name ->
    def value = project.findProperty(name) ?: System.getenv(name)
    return value?.toString()?.trim() ?: null
}

def uploadKeystore = credential('CSP_UPLOAD_STORE_FILE')
def uploadStorePassword = credential('CSP_UPLOAD_STORE_PASSWORD')
def uploadKeyAlias = credential('CSP_UPLOAD_KEY_ALIAS')
def uploadKeyPassword = credential('CSP_UPLOAD_KEY_PASSWORD')

/*
 * Fail before compiling, not at the signing step twenty minutes later.
 *
 * Only when a release is what was actually asked for: `assembleDebug` and the
 * bundle tasks have no business needing an upload key, and a configuration
 * block that threw unconditionally would stop those too.
 */
def wantsRelease = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
if (wantsRelease) {
    def missing = [
        'CSP_UPLOAD_STORE_FILE': uploadKeystore,
        'CSP_UPLOAD_STORE_PASSWORD': uploadStorePassword,
        'CSP_UPLOAD_KEY_ALIAS': uploadKeyAlias,
        'CSP_UPLOAD_KEY_PASSWORD': uploadKeyPassword,
    ].findAll { it.value == null }.keySet()

    if (!missing.isEmpty()) {
        throw new GradleException("""
            A release build needs the upload key. Missing: ${missing.join(', ')}.

            This used to fall back to the debug key, which is committed to this
            repository with the password "android". Play refuses such an APK,
            but sideloading does not — and an Android app can only ever be
            replaced by a build signed with the same key, so a pilot signed with
            the debug key cannot be updated at all.

            For a real build, set all four (~/.gradle/gradle.properties, -P, or
            the environment) pointing at the keystore held by whoever publishes
            the app.

            For a throwaway — a size check, or an APK to install on a test
            handset, which is what CI builds:

              keytool -genkeypair -v -keystore /tmp/throwaway.jks \\
                -alias throwaway -keyalg RSA -keysize 2048 -validity 30 \\
                -storepass throwaway -keypass throwaway \\
                -dname "CN=Civil Servant Protect throwaway, O=not for release"

              ./gradlew assembleRelease \\
                -PCSP_UPLOAD_STORE_FILE=/tmp/throwaway.jks \\
                -PCSP_UPLOAD_STORE_PASSWORD=throwaway \\
                -PCSP_UPLOAD_KEY_ALIAS=throwaway \\
                -PCSP_UPLOAD_KEY_PASSWORD=throwaway

            Anything installed from a throwaway build has to be uninstalled
            before a properly signed one will replace it.
        """.stripIndent())
    }
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "ng.csp.mobile"
    defaultConfig {
        applicationId "ng.csp.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        // English plus the four the scheme is delivered in. Every other locale's
        // resources are dropped from the APK — see the note on splits below.
        resConfigs "en", "ha", "yo", "ig"
    }

    /*
     * One APK per ABI, rather than one carrying every architecture.
     *
     * The spec's budget is 8 MB, and the single biggest thing in a React Native
     * APK is the native libraries — Hermes and the RN runtime, compiled four
     * times over in a universal build. Split, a handset downloads the one it
     * can run and roughly a third of the bytes.
     *
     * That matters more here than it usually does: the people this is for buy
     * data in ₦100 bundles, and an app that costs a morning's airtime to
     * install is an app they do not install.
     *
     * Measured on the first CI build: 12.3 MB for armeabi-v7a against 16.6 MB
     * for arm64 and 55.1 MB for a universal APK — so the split is worth having
     * even though none of these is inside the spec's 8 MB yet. See the plan's
     * note on that gap.
     */
    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            /*
             * No universal APK. It measured 55.1 MB — every architecture's
             * native libraries in one file, of which a handset uses one set.
             * Nobody installs that deliberately, and on a ₦100 data bundle
             * nobody installs it by accident twice.
             *
             * The x86 builds are here so an emulator can run one; they are not
             * shipped, and CI uploads only the two ARM builds, which are the
             * only ones a phone in Nigeria can run.
             */
            universalApk false
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        /*
         * The upload key, from outside this repository.
         *
         * Only defined when the properties are actually there, because a
         * signingConfig pointing at a keystore that does not exist fails at
         * signing time with a message about a missing file rather than about a
         * missing credential.
         */
        if (uploadKeystore) {
            release {
                storeFile file(uploadKeystore)
                storePassword uploadStorePassword
                keyAlias uploadKeyAlias
                keyPassword uploadKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            /*
             * Signed with the upload key, or not built at all.
             *
             * This said `signingConfig signingConfigs.debug` — React Native's
             * default, with a comment reminding whoever read it to generate
             * their own. Nobody reads a comment while running a release build,
             * and the failure it warns about is silent: the APK builds, it
             * installs, it works, and it is signed with a key whose password is
             * the string "android" and which is committed to this repository.
             *
             * Two things follow from that, and the second is the one that
             * bites. Google Play refuses an APK signed with a debug key, so
             * that route fails loudly. Sideloading does not — a pilot could
             * hand out a hundred installs and only discover the problem at the
             * first update, because an Android app can only be replaced by a
             * build signed with the same key. There is no recovery from that
             * except uninstalling every copy, which for a scheme whose members
             * keep the app for decades is not a recovery.
             *
             * So an unconfigured release build now stops — see the message
             * thrown above for what to set, including the throwaway CI uses to
             * produce an installable artefact.
             *
             * Guarded, because buildTypes is configured on every invocation and
             * not only on the one that asked for a release. Referring to
             * `signingConfigs.release` unconditionally would fail `assembleDebug`
             * with "SigningConfig with name 'release' not found" on any machine
             * without the credentials, which is every machine that is not
             * building a release. When a release *is* what was asked for, the
             * check above has already stopped the build if this would be unset.
             */
            if (uploadKeystore) {
                signingConfig signingConfigs.release
            }
            minifyEnabled enableProguardInReleaseBuilds
            // Unreferenced drawables, layouts and strings go with the
            // unreferenced code. Needs minifyEnabled, which is why it is here
            // rather than beside it.
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

/*
 * Distinct version codes per ABI, highest for the architecture that should win
 * when a store has several to choose from.
 */
ext.abiCodes = ["armeabi-v7a": 1, "x86": 2, "arm64-v8a": 3, "x86_64": 4]

android.applicationVariants.configureEach { variant ->
    variant.outputs.each { output ->
        def abi = output.getFilter(com.android.build.OutputFile.ABI)
        def offset = abi == null ? 0 : project.ext.abiCodes.get(abi, 0)
        output.versionCodeOverride = variant.versionCode * 10 + offset
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
