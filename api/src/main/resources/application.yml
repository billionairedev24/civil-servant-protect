spring:
  batch:
    jdbc:
      # Flyway owns the schema — Batch's tables are in V8. Two things creating
      # tables in one database is how a migration history stops describing what
      # is actually there.
      initialize-schema: never
    job:
      # Jobs are launched by the upload endpoint, not at startup. Without this,
      # every boot would re-run the last schedule load.
      enabled: false
  application:
    name: csp-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/csp}
    username: ${DATABASE_USER:csp}
    password: ${DATABASE_PASSWORD:csp}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      # Fail fast and let the client retry rather than queueing until the
      # ingress times out.
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Pinned rather than inherited. Postgres resolves an unqualified schema via
    # search_path, which is "$user", public — and the application user is called
    # csp, which is also the name of the schema the migrations create for helper
    # functions. Left to default, Flyway adopts that schema as its own on the
    # second run, finds it non-empty with no history table, and refuses to start.
    schemas: public
    default-schema: public
  threads:
    # Virtual threads: these handlers are almost entirely waiting on Postgres.
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful
  # Behind an ingress, so the client address must come from the forwarded
  # header rather than from the proxy's own.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      # Liveness is "the process is up"; readiness is "it can actually serve".
      # A pod with no database should stop taking traffic, not restart forever.
      probes:
        enabled: true
      group:
        readiness:
          include: db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

csp:
  jwt-secret: ${JWT_SECRET:}
  access-token-ttl: ${ACCESS_TOKEN_TTL:20m}
  refresh-token-ttl: ${REFRESH_TOKEN_TTL:8h}
  # Origin patterns, not exact origins — see SecurityConfig#corsSource. The
  # default is loopback on any port, which covers `npm run dev` (5173),
  # `npm run preview` (4173) and the browser tests. Deployment replaces it.
  cors-origins: ${CORS_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}
  crypto:
    hsm:
      # The in-country HSM the spec requires. Off locally, mandatory under the
      # prod profile — see ProductionSafetyCheck. `config` is a SunPKCS11
      # configuration file naming the vendor's library and slot; the keys must
      # already exist in the token under the labels in KeyVault.Purpose, because
      # a key ceremony is a witnessed procedure and not something a pod does on
      # first boot.
      enabled: ${HSM_ENABLED:false}
      config: ${HSM_CONFIG:}
      pin: ${HSM_PIN:}
  integrations:
    # `stub` answers locally: no SMS leaves the machine, no NIN reaches NIMC and
    # no money moves — but every call still goes through the replay log and the
    # circuit breakers, so the recorded behaviour is the real behaviour.
    # `http` calls the endpoints below. See SETUP.md.
    mode: ${INTEGRATIONS_MODE:stub}
    nimc-url: ${NIMC_URL:}
    comms-url: ${COMMS_URL:}
    comms-sender: ${COMMS_SENDER:CSProtect}
    payout-url: ${PAYOUT_URL:}
  evidence:
    # Where claim documents are kept. `local` writes under `root` and hands the
    # browser this service's own upload endpoint, so the claim path works on a
    # checkout with nothing else running; it is refused under the prod profile.
    # `s3` is any S3-compatible store — `docker compose up minio` gives you one
    # locally. See SETUP.md.
    mode: ${EVIDENCE_MODE:local}
    root: ${EVIDENCE_ROOT:./var/evidence}
    # The address the *browser* uses to reach this service, which behind an
    # ingress is not the address the container knows itself by.
    base-url: ${EVIDENCE_BASE_URL:http://localhost:8080}
    endpoint: ${EVIDENCE_ENDPOINT:}
    region: ${EVIDENCE_REGION:us-east-1}
    bucket: ${EVIDENCE_BUCKET:}
    access-key: ${EVIDENCE_ACCESS_KEY:}
    secret-key: ${EVIDENCE_SECRET_KEY:}
  roll-file:
    # The PGP key that signs the record of each schedule load, armoured. Belongs
    # in Vault: it is the key that says a roll file is ours, and a scheme that
    # cannot prove what a payroll sent has no answer to an audit.
    #
    # Unset, a key is generated at startup and lost when the process exits, so
    # signatures stop verifying at the next restart — fine locally, refused
    # under the prod profile. See SETUP.md.
    signing-key: ${ROLL_FILE_SIGNING_KEY:}
    passphrase: ${ROLL_FILE_PASSPHRASE:}
  otp:
    echo: ${OTP_ECHO:false}
    fixed-code: ${OTP_FIXED_CODE:#{null}}

logging:
  level:
    root: ${LOG_LEVEL:info}
