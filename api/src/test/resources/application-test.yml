# Tests need a real Postgres and Redis. docker compose up -d db redis, or the
# services: block in .gitlab-ci.yml, provides both.
spring:
  datasource:
    url: ${TEST_DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/csp_test}
    username: ${TEST_DATABASE_USER:csp}
    password: ${TEST_DATABASE_PASSWORD:csp}
  data:
    redis:
      host: ${TEST_REDIS_HOST:127.0.0.1}
      port: ${TEST_REDIS_PORT:6379}
      # A database of its own, so a test run cannot evict a developer's session.
      database: 15
  flyway:
    schemas: public
    default-schema: public
    # Each run starts from nothing — see TestSchemaReset, which cleans and then
    # migrates. This only permits it; the cleaning is a bean, because the
    # property that used to be here (`clean-on-validation-error`) does not exist
    # in Spring Boot 4 and was silently ignored, so the comment promising a
    # fresh schema was the only part that was working.
    clean-disabled: false

csp:
  schedule:
    # Tiny, so a handful of rows crosses several chunk boundaries. The bug this
    # guards against is invisible on any file smaller than one chunk.
    chunk-size: 2
  evidence:
    # Under target/, so `mvn clean` takes the test's evidence with it and a run
    # never reads a file an earlier run left behind.
    root: target/evidence
  jwt-secret: test-secret-that-is-at-least-32-characters-long
  token-issuer: https://member-auth.csp.test
  otp:
    echo: true
    fixed-code: "000000"

logging:
  level:
    root: warn
