name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The API. Postgres and Redis are real services rather than stand-ins,
  # because every rule worth testing here lives in the database: the ledger's
  # append-only triggers, row-level security by rail, the deferred share-sum
  # constraint, the audit hash chain. An in-memory database would pass and
  # prove nothing.
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        # `postgres` bootstraps, and the step below creates `csp` as an ordinary
        # role. POSTGRES_USER: csp made it the superuser, and a superuser
        # bypasses row-level security entirely — which is why the five tests
        # asserting that one employer cannot see another's members failed here
        # and passed everywhere else. See deploy/local/init-db.sql.
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/csp_test
      TEST_REDIS_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v5

      # The same script the local compose file mounts, so CI and a laptop get
      # the same role with the same attributes.
      - name: Create the application role and databases
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f deploy/local/init-db.sql

      - uses: actions/setup-java@v5
        with:
          # The build spec says Java 25 and the pom sets --release 25, so an
          # older JDK does not compile this at all.
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Verify
        working-directory: api
        shell: bash
        run: |
          set -o pipefail
          mvn -B -ntp verify 2>&1 | tee verify.log

      - name: Test report
        if: always()
        run: |
          if [ -d api/target/surefire-reports ]; then
            grep -h "tests=" api/target/surefire-reports/TEST-*.xml \
              | sed 's/.*name="\([^"]*\)".*tests="\([0-9]*\)".*failures="\([0-9]*\)".*/  \1: \2 tests, \3 failures/' \
              >> "$GITHUB_STEP_SUMMARY" || true
          fi

      # The same treatment the smoke test gets, and for the same reason: a
      # failure whose only copy is in the log archive is a failure somebody has
      # to go and find. Worse here, because this job can fail *before* any test
      # runs — a dependency that will not resolve, a compile error, a Postgres
      # that never came up — and then the test report above has nothing to say
      # and the check goes red with no text at all.
      - name: Report verify failure
        if: failure()
        shell: bash
        run: |
          {
            echo '### API verify failed'
            echo ''
            echo '```'
            tail -120 api/verify.log 2>/dev/null || echo 'no verify.log — the job failed before Maven started'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          detail=$(grep -E '^\[ERROR\]' api/verify.log 2>/dev/null | head -5 | tr '\n' ' ' | cut -c1-900)
          [ -n "$detail" ] || detail=$(tail -5 api/verify.log 2>/dev/null | tr '\n' ' ' | cut -c1-900)
          [ -n "$detail" ] || detail='failed before Maven produced any output'
          echo "::error title=API verify::${detail}"

  # The Helm chart, without needing a cluster. `helm template` across every
  # environment, because a chart that only renders for dev breaks on the Friday
  # someone promotes to prod.
  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Structure check
        run: |
          pip install --quiet pyyaml
          python3 deploy/helm/check-templates.py

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Render every environment
        run: |
          for env in dev prod; do
            echo "── $env"
            helm template csp deploy/helm/csp \
              --values deploy/helm/csp/values.yaml \
              --values deploy/environments/$env.values.yaml \
              --set api.image.tag=ci \
              --set memberWeb.image.tag=ci \
              --set console.image.tag=ci > /dev/null
          done

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Chromium only — the smoke test drives one browser, and installing the
      # full set triples the job for nothing.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Loads every route in all three applications — 48 of them — plus each
      # rail, language and scenario flag, failing on any uncaught exception or
      # console error. Because screens are addresses now, this also proves deep
      # links and refresh work.
      - name: Smoke test
        shell: bash
        run: npm run smoke 2>&1 | tee smoke.log

      # Asserts the collection rail actually branches: a self-paying member is
      # never told their salary was deducted, and a payroll sponsor is never
      # offered a debit run as the main collection.
      - name: Rail branching
        shell: bash
        run: npm run test:rails 2>&1 | tee -a smoke.log

      # Reports contrast and hit-target findings; fails only on a control with
      # no accessible name, which is always a bug and never a design decision.
      - name: Accessibility audit
        shell: bash
        run: npm run a11y 2>&1 | tee -a smoke.log

      # A browser failure needs its output where the change is reviewed, not
      # only in a log archive. The job summary carries the full tail; the
      # ::error:: annotation carries a one-line version, which surfaces on the
      # PR and in the checks API without needing a write-scoped token.
      - name: Report smoke failure
        if: failure()
        shell: bash
        run: |
          {
            echo '### Smoke test failed'
            echo ''
            echo '```'
            tail -80 smoke.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          detail=$(grep -E '^\s*(✗|console:|uncaught:)' smoke.log | head -5 | tr '\n' ' ' | cut -c1-900)
          [ -n "$detail" ] || detail=$(tail -5 smoke.log | tr '\n' ' ' | cut -c1-900)
          echo "::error title=Smoke test::${detail}"

  # The phone app.
  #
  # This job exists because nowhere else can build it: an APK needs the Android
  # SDK, and the machine this was written on has Gradle and no SDK at all. So
  # "it compiles" is proved here rather than claimed, and the sizes below are
  # measured rather than estimated.
  #
  # It does not prove the app runs. Nothing short of a handset does that, and
  # the artefact is uploaded so somebody can install it and find out.
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      # The root's too: Metro compiles `src/` from the repository, which is the
      # point of the whole arrangement — the phone and the browser run the same
      # API client, the same i18n table and the same claim wizard.
      - name: Install
        run: |
          npm ci
          npm ci --prefix mobile

      # Against the shared code, with `.native.ts` resolution on — so the
      # typecheck sees the modules Metro will actually bundle.
      - name: Typecheck
        run: npm run typecheck --prefix mobile

      # Bundling is where a shared module that cannot cross to React Native
      # shows up: a DOM type is a compile error, but a `document` reference or a
      # Vite-only import is not, and it fails here instead.
      - name: Bundle
        working-directory: mobile
        run: |
          npx react-native bundle --platform android --dev false \
            --entry-file index.js \
            --bundle-output /tmp/index.android.bundle --assets-dest /tmp/assets

      - name: Build the APKs
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      # The spec's budget is 8 MB per ABI. Reported rather than enforced: this
      # is the first build, the number is what it is, and a job that failed on
      # it before anyone has seen it would just get the check deleted.
      - name: Sizes
        shell: bash
        run: |
          {
            echo '### APK sizes'
            echo ''
            echo '| Build | Size | Against the 8 MB budget |'
            echo '|---|---|---|'
            for apk in mobile/android/app/build/outputs/apk/release/*.apk; do
              bytes=$(stat -c%s "$apk")
              mb=$(awk "BEGIN{printf \"%.1f\", $bytes/1048576}")
              verdict=$(awk "BEGIN{print ($bytes <= 8388608) ? \"within\" : \"over\"}")
              echo "| $(basename "$apk") | ${mb} MB | ${verdict} |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: csp-mobile-apks
          path: mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Report failure
        if: failure()
        shell: bash
        run: echo "::error title=Mobile::The phone app did not build — see this job's log."
